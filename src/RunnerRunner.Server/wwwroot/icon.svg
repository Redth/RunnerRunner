<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Runner figure - dynamic running pose -->
  <g transform="translate(256, 240)" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Head -->
    <circle cx="20" cy="-100" r="32" fill="white" stroke="none"/>

    <!-- Body torso -->
    <line x1="20" y1="-68" x2="-10" y2="20"/>

    <!-- Leading arm (forward) -->
    <polyline points="20,-40 70,-70 110,-45"/>

    <!-- Trailing arm (back) -->
    <polyline points="-5,-30 -60,-55 -95,-25"/>

    <!-- Leading leg (forward stride) -->
    <polyline points="-10,20 50,70 100,55"/>

    <!-- Trailing leg (back stride) -->
    <polyline points="-10,20 -65,75 -100,110"/>
  </g>

  <!-- Speed lines for motion effect -->
  <g stroke="url(#accent)" stroke-width="12" stroke-linecap="round" opacity="0.6">
    <line x1="80" y1="180" x2="130" y2="180"/>
    <line x1="60" y1="220" x2="140" y2="220"/>
    <line x1="70" y1="260" x2="120" y2="260"/>
  </g>

  <!-- Circular orbit/deploy ring -->
  <circle cx="300" cy="190" r="60" stroke="url(#accent)" stroke-width="10" fill="none" opacity="0.4" stroke-dasharray="20 15"/>
</svg>
