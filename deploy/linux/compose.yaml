services:
  postgres:
    image: postgres:17
    container_name: runnerrunner-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-runnerrunner}
      POSTGRES_USER: ${POSTGRES_USER:-runnerrunner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${LINUX_BIND_IP:-0.0.0.0}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-runnerrunner} -d ${POSTGRES_DB:-runnerrunner}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ${SERVER_IMAGE:-ghcr.io/redth/runnerrunner-server:${RUNNERRUNNER_VERSION:-latest}}
    container_name: runnerrunner-server
    ports:
      - "${LINUX_BIND_IP:-0.0.0.0}:${SERVER_PORT:-4779}:4779"
      - "${LINUX_BIND_IP:-0.0.0.0}:${HOSTWORKER_GRPC_PORT:-4780}:4780"
      - "${LINUX_BIND_IP:-0.0.0.0}:11111:11111"
      - "${LINUX_BIND_IP:-0.0.0.0}:30000:30000"
    volumes:
      - server-data:/app/data
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-runnerrunner};Username=${POSTGRES_USER:-runnerrunner};Password=${POSTGRES_PASSWORD}
      HostWorker__EnrollmentToken: ${HOSTWORKER_ENROLLMENT_TOKEN:?HOSTWORKER_ENROLLMENT_TOKEN must be set}
      Kestrel__Endpoints__Web__Url: http://+:4779
      Kestrel__Endpoints__Web__Protocols: Http1
      Kestrel__Endpoints__HostWorkerGrpc__Url: http://+:4780
      Kestrel__Endpoints__HostWorkerGrpc__Protocols: Http2
      DOTNET_ENVIRONMENT: Production
      HostWorkerEnrollment__PublicServerUrl: ${HOSTWORKER_PUBLIC_SERVER_URL:-}
      HostWorkerEnrollment__HttpProxy: ${HOSTWORKER_HTTP_PROXY:-}
      HostWorkerEnrollment__HttpsProxy: ${HOSTWORKER_HTTPS_PROXY:-}
      HostWorkerEnrollment__NoProxy: ${HOSTWORKER_NO_PROXY:-}
      Logging__Console__FormatterName: ${LOGGING_CONSOLE_FORMATTER_NAME:-simple}
      Logging__Console__IncludeScopes: ${LOGGING_CONSOLE_INCLUDE_SCOPES:-false}
      Orleans__AdvertisedIPAddress: ${ORLEANS_ADVERTISED_IP:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  host-worker:
    image: ${HOSTWORKER_IMAGE:-ghcr.io/redth/runnerrunner-hostworker:${RUNNERRUNNER_VERSION:-latest}}
    container_name: runnerrunner-host-worker
    profiles: ["linux-worker"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hostworker-data:/var/lib/runnerrunner
    environment:
      HostWorker__ServerUrl: http://server:4780
      HostWorker__EnrollmentToken: ${HOSTWORKER_ENROLLMENT_TOKEN:?HOSTWORKER_ENROLLMENT_TOKEN must be set}
      HostWorker__HostId: ${HOSTWORKER_HOST_ID:-local-docker-host}
      HostWorker__HostName: ${HOSTWORKER_HOST_NAME:-local-docker-host}
      HostWorker__Platform: Linux
      HostWorker__DataRoot: /var/lib/runnerrunner
      HostWorker__ContainerImage: ${HOSTWORKER_IMAGE:-ghcr.io/redth/runnerrunner-hostworker:${RUNNERRUNNER_VERSION:-latest}}
      DOTNET_ENVIRONMENT: Production
      Logging__Console__FormatterName: ${LOGGING_CONSOLE_FORMATTER_NAME:-simple}
      Logging__Console__IncludeScopes: ${LOGGING_CONSOLE_INCLUDE_SCOPES:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=production}
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: runnerrunner-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    profiles: ["observability"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${LINUX_BIND_IP:-0.0.0.0}:4317:4317"
      - "${LINUX_BIND_IP:-0.0.0.0}:4318:4318"
    restart: unless-stopped

volumes:
  postgres-data:
  server-data:
  hostworker-data:
