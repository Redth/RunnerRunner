services:
  postgres:
    image: postgres:17
    container_name: runnerrunner-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-runnerrunner}
      POSTGRES_USER: ${POSTGRES_USER:-runnerrunner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${LINUX_BIND_IP:-0.0.0.0}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-runnerrunner} -d ${POSTGRES_DB:-runnerrunner}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ${SERVER_IMAGE:-ghcr.io/redth/runnerrunner/server:${RUNNERRUNNER_VERSION:-latest}}
    container_name: runnerrunner-server
    ports:
      - "${LINUX_BIND_IP:-0.0.0.0}:${SERVER_PORT:-4779}:4779"
      - "${LINUX_BIND_IP:-0.0.0.0}:11111:11111"
      - "${LINUX_BIND_IP:-0.0.0.0}:30000:30000"
    volumes:
      - server-data:/app/data
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-runnerrunner};Username=${POSTGRES_USER:-runnerrunner};Password=${POSTGRES_PASSWORD}
      ASPNETCORE_URLS: http://+:4779
      DOTNET_ENVIRONMENT: Production
      Orleans__AdvertisedIPAddress: ${ORLEANS_ADVERTISED_IP:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  host-silo:
    image: ${HOSTSILO_IMAGE:-ghcr.io/redth/runnerrunner/hostsilo:${RUNNERRUNNER_VERSION:-latest}}
    container_name: runnerrunner-host-silo
    ports:
      - "${LINUX_BIND_IP:-0.0.0.0}:11112:11112"
      - "${LINUX_BIND_IP:-0.0.0.0}:30001:30001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-runnerrunner};Username=${POSTGRES_USER:-runnerrunner};Password=${POSTGRES_PASSWORD}
      HostSilo__HostId: ${HOSTSILO_HOST_ID:-local-docker-host}
      HostSilo__HostName: ${HOSTSILO_HOST_NAME:-local-docker-host}
      HostSilo__Platform: Linux
      DOTNET_ENVIRONMENT: Production
      Orleans__AdvertisedIPAddress: ${ORLEANS_HOST_SILO_IP:-}
      Orleans__SiloPort: 11112
      Orleans__GatewayPort: 30001
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  server-data:
