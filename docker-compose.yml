services:
  postgres:
    image: postgres:17
    container_name: runnerrunner-postgres
    environment:
      - POSTGRES_DB=runnerrunner
      - POSTGRES_USER=runnerrunner
      - POSTGRES_PASSWORD=runnerrunner
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runnerrunner"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: src/RunnerRunner.Server/Dockerfile
    container_name: runnerrunner-server
    ports:
      - "4779:4779"
    volumes:
      - server-data:/app/data
    environment:
      - Database__ConnectionString=Host=postgres;Port=5432;Database=runnerrunner;Username=runnerrunner;Password=runnerrunner
      - ASPNETCORE_URLS=http://+:4779
    labels:
      - "npm.proxy.domain=runnerrunner.jjagd.net"
      - "npm.proxy.port=4779"
      - "npm.proxy.ssl.force=true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  host-silo:
    build:
      context: .
      dockerfile: src/RunnerRunner.HostSilo/Dockerfile
    container_name: runnerrunner-host-silo
    environment:
      - Database__ConnectionString=Host=postgres;Port=5432;Database=runnerrunner;Username=runnerrunner;Password=runnerrunner
      - HostSilo__HostId=local-docker-host
      - HostSilo__HostName=local-docker-host
      - HostSilo__Platform=Linux
      - DOTNET_ENVIRONMENT=Production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  server-data:
  postgres-data:
