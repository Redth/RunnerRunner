services:
  postgres:
    image: postgres:17
    container_name: runnerrunner-postgres
    environment:
      - POSTGRES_DB=runnerrunner
      - POSTGRES_USER=runnerrunner
      - POSTGRES_PASSWORD=runnerrunner
    ports:
      - "${LINUX_BIND_IP:-0.0.0.0}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U runnerrunner -d runnerrunner"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: src/RunnerRunner.Server/Dockerfile
      args:
        INFORMATIONAL_VERSION: ${RUNNERRUNNER_VERSION:-dev}
        SOURCE_REVISION_ID: ${RUNNERRUNNER_COMMIT_SHA:-unknown}
        BUILD_TAG: ${RUNNERRUNNER_VERSION:-dev}
    container_name: runnerrunner-server
    ports:
      - "${LINUX_BIND_IP:-0.0.0.0}:4779:4779"
      - "${LINUX_BIND_IP:-0.0.0.0}:4780:4780"
      - "${LINUX_BIND_IP:-0.0.0.0}:11111:11111"
      - "${LINUX_BIND_IP:-0.0.0.0}:30000:30000"
    volumes:
      - server-data:/app/data
    environment:
      - Database__ConnectionString=Host=postgres;Port=5432;Database=runnerrunner;Username=runnerrunner;Password=runnerrunner
      - HostWorker__EnrollmentToken=${HOSTWORKER_ENROLLMENT_TOKEN:-dev-hostworker-token}
      - Kestrel__Endpoints__Web__Url=http://+:4779
      - Kestrel__Endpoints__Web__Protocols=Http1
      - Kestrel__Endpoints__HostWorkerGrpc__Url=http://+:4780
      - Kestrel__Endpoints__HostWorkerGrpc__Protocols=Http2
      - Orleans__AdvertisedIPAddress=${ORLEANS_ADVERTISED_IP:-}
      - HostWorkerEnrollment__PublicServerUrl=${HOSTWORKER_PUBLIC_SERVER_URL:-}
      - HostWorkerUpdates__PublicBaseUrl=${HOSTWORKER_UPDATE_PUBLIC_BASE_URL:-}
      - HostWorkerEnrollment__HttpProxy=${HOSTWORKER_HTTP_PROXY:-}
      - HostWorkerEnrollment__HttpsProxy=${HOSTWORKER_HTTPS_PROXY:-}
      - HostWorkerEnrollment__NoProxy=${HOSTWORKER_NO_PROXY:-}
      - DOTNET_ENVIRONMENT=Production
      - Logging__Console__FormatterName=${LOGGING_CONSOLE_FORMATTER_NAME:-simple}
      - Logging__Console__IncludeScopes=${LOGGING_CONSOLE_INCLUDE_SCOPES:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  host-worker:
    build:
      context: .
      dockerfile: src/RunnerRunner.HostWorker/Dockerfile
      args:
        INFORMATIONAL_VERSION: ${RUNNERRUNNER_VERSION:-dev}
        SOURCE_REVISION_ID: ${RUNNERRUNNER_COMMIT_SHA:-unknown}
        BUILD_TAG: ${RUNNERRUNNER_VERSION:-dev}
    container_name: runnerrunner-host-worker
    environment:
      - HostWorker__ServerUrl=http://server:4780
      - HostWorker__EnrollmentToken=${HOSTWORKER_ENROLLMENT_TOKEN:-dev-hostworker-token}
      - HostWorker__HostId=local-docker-host
      - HostWorker__HostName=local-docker-host
      - HostWorker__Platform=Linux
      - HostWorker__DataRoot=/var/lib/runnerrunner
      - DOTNET_ENVIRONMENT=Production
      - Logging__Console__FormatterName=${LOGGING_CONSOLE_FORMATTER_NAME:-simple}
      - Logging__Console__IncludeScopes=${LOGGING_CONSOLE_INCLUDE_SCOPES:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hostworker-data:/var/lib/runnerrunner
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
    restart: unless-stopped

volumes:
  server-data:
  postgres-data:
  hostworker-data:
