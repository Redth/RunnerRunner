services:
  server:
    build:
      context: .
      dockerfile: src/RunnerRunner.Server/Dockerfile
    container_name: runnerrunner-server
    ports:
      - "4779:4779"
    volumes:
      - server-data:/app/data
    environment:
      - Database__Path=/app/data/runnerrunner.db
      - ASPNETCORE_URLS=http://+:4779
    labels:
      - "npm.proxy.domain=runnerrunner.jjagd.net"
      - "npm.proxy.port=4779"
      - "npm.proxy.ssl.force=true"
    restart: unless-stopped

  # Example: local agent running on the same Docker host
  agent-local:
    build:
      context: .
      dockerfile: src/RunnerRunner.Agent/Dockerfile
    container_name: runnerrunner-agent
    environment:
      - RunnerRunner__ServerUrl=http://server:4779
      - RunnerRunner__AgentName=local-docker-host
      - RunnerRunner__AgentToken=changeme
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server-data:
