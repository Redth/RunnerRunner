name: Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "10.0.x"
  SERVER_IMAGE: ghcr.io/redth/runnerrunner-server
  HOSTWORKER_IMAGE: ghcr.io/redth/runnerrunner-hostworker
  HOSTWORKER_WINDOWS_IMAGE: ghcr.io/redth/runnerrunner-hostworker-windows

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RunnerRunner.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INFORMATIONAL_VERSION=${{ github.sha }}
            SOURCE_REVISION_ID=${{ github.sha }}
            BUILD_TAG=main
          tags: |
            ${{ env.SERVER_IMAGE }}:main
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}

      - name: Build and push HostWorker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RunnerRunner.HostWorker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INFORMATIONAL_VERSION=${{ github.sha }}
            SOURCE_REVISION_ID=${{ github.sha }}
            BUILD_TAG=main
          tags: |
            ${{ env.HOSTWORKER_IMAGE }}:main
            ${{ env.HOSTWORKER_IMAGE }}:${{ github.sha }}

      - name: Publish native HostWorker assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release artifacts/publish
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64; do
            out="artifacts/publish/${rid}"
            dotnet publish src/RunnerRunner.HostWorker/RunnerRunner.HostWorker.csproj \
              -c Release \
              -r "${rid}" \
              --self-contained \
              -o "${out}" \
              /p:InformationalVersion="${GITHUB_SHA}" \
              /p:SourceRevisionId="${GITHUB_SHA}" \
              /p:RunnerRunnerCommitSha="${GITHUB_SHA}" \
              /p:RunnerRunnerBuildTag="${GITHUB_REF_NAME}" \
              --nologo

            if [[ "${rid}" == win-* ]]; then
              (cd "${out}" && zip -qr "../../release/runnerrunner-hostworker-${rid}.zip" .)
            else
              tar -czf "artifacts/release/runnerrunner-hostworker-${rid}.tar.gz" -C "${out}" .
            fi
          done

      - name: Generate HostWorker artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/release
          python - <<'PY'
          import hashlib, json, os
          assets = []
          for name in sorted(os.listdir(".")):
              if not name.startswith("runnerrunner-hostworker-"):
                  continue
              if os.path.isfile(name):
                  with open(name, "rb") as f:
                      digest = hashlib.sha256(f.read()).hexdigest()
                  assets.append({"name": name, "sha256": digest})
          manifest = {
              "version": os.environ["GITHUB_SHA"],
              "gitSha": os.environ["GITHUB_SHA"],
              "images": {
                  "server": [
                      f"{os.environ['SERVER_IMAGE']}:{os.environ['GITHUB_SHA']}",
                      f"{os.environ['SERVER_IMAGE']}:main"
                  ],
                  "hostworker": [
                      f"{os.environ['HOSTWORKER_IMAGE']}:{os.environ['GITHUB_SHA']}",
                      f"{os.environ['HOSTWORKER_IMAGE']}:main"
                  ],
                  "hostworkerWindows": [
                      f"{os.environ['HOSTWORKER_WINDOWS_IMAGE']}:{os.environ['GITHUB_SHA']}",
                      f"{os.environ['HOSTWORKER_WINDOWS_IMAGE']}:main"
                  ]
              },
              "assets": assets
          }
          with open("release-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

      - name: Upload HostWorker update manifest
        uses: actions/upload-artifact@v4
        with:
          name: runnerrunner-hostworker-manifest
          path: artifacts/release/release-manifest.json
          if-no-files-found: error

      - name: Upload HostWorker update assets
        uses: actions/upload-artifact@v4
        with:
          name: runnerrunner-hostworker-assets
          path: artifacts/release/runnerrunner-hostworker-*
          if-no-files-found: error

  publish-windows-hostworker:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Ensure Docker daemon is running
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            throw "Docker service is not installed on this runner."
          }

          if ($service.Status -ne "Running") {
            Start-Service docker
          }

          $ready = $false
          $deadline = (Get-Date).AddMinutes(2)
          do {
            docker version
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)

          if (-not $ready) {
            throw "Docker daemon did not become ready."
          }

      - name: Log in to GHCR
        shell: pwsh
        run: |
          "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish Windows HostWorker
        shell: pwsh
        run: |
          $publishDir = "artifacts\windows-hostworker-container"
          dotnet publish src\RunnerRunner.HostWorker\RunnerRunner.HostWorker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -o $publishDir `
            /p:InformationalVersion=${{ github.sha }} `
            /p:SourceRevisionId=${{ github.sha }} `
            /p:RunnerRunnerCommitSha=${{ github.sha }} `
            /p:RunnerRunnerBuildTag=main `
            --nologo

      - name: Build and push Windows HostWorker image
        shell: pwsh
        run: |
          $publishDir = "artifacts\windows-hostworker-container"
          docker build `
            -f src\RunnerRunner.HostWorker\Dockerfile.windows `
            --build-arg INFORMATIONAL_VERSION=${{ github.sha }} `
            --build-arg SOURCE_REVISION_ID=${{ github.sha }} `
            --build-arg BUILD_TAG=main `
            -t "${{ env.HOSTWORKER_WINDOWS_IMAGE }}:main" `
            -t "${{ env.HOSTWORKER_WINDOWS_IMAGE }}:${{ github.sha }}" `
            $publishDir
          docker run --rm `
            --entrypoint powershell `
            "${{ env.HOSTWORKER_WINDOWS_IMAGE }}:${{ github.sha }}" `
            -NoProfile `
            -Command '$ErrorActionPreference = "Stop"; if ($env:HostWorker__DataRoot -match "[`r`n]") { throw "HostWorker__DataRoot contains a control character." }; [System.IO.Directory]::CreateDirectory($env:HostWorker__DataRoot) | Out-Null; Write-Host $env:HostWorker__DataRoot'
          docker push "${{ env.HOSTWORKER_WINDOWS_IMAGE }}:main"
          docker push "${{ env.HOSTWORKER_WINDOWS_IMAGE }}:${{ github.sha }}"
