name: Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SERVER_IMAGE: ghcr.io/redth/runnerrunner-server
  HOSTWORKER_IMAGE: ghcr.io/redth/runnerrunner-hostworker

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RunnerRunner.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INFORMATIONAL_VERSION=${{ github.sha }}
          tags: |
            ${{ env.SERVER_IMAGE }}:main
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}

      - name: Build and push HostWorker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RunnerRunner.HostWorker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INFORMATIONAL_VERSION=${{ github.sha }}
          tags: |
            ${{ env.HOSTWORKER_IMAGE }}:main
            ${{ env.HOSTWORKER_IMAGE }}:${{ github.sha }}
