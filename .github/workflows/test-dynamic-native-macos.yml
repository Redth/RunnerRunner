name: Test Dynamic Native Runner (macOS)

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Test message to log'
        required: false
        default: 'Hello from dynamic native macOS runner!'

jobs:
  test-macos:
    runs-on: [self-hosted, macOS, native]
    steps:
      - name: Runner Info
        run: |
          echo "========================================="
          echo "  RunnerRunner Dynamic Native Runner Test"
          echo "  Platform: macOS"
          echo "========================================="
          echo ""
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Arch: $RUNNER_ARCH"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Working Dir: $(pwd)"
          echo ""
          echo "RR_INSTANCE_ID: ${RR_INSTANCE_ID:-not set}"
          echo "RR_RUNNER_NAME: ${RR_RUNNER_NAME:-not set}"
          echo "RR_PROVISIONING_MODE: ${RR_PROVISIONING_MODE:-not set}"
          echo ""

      - name: System Info
        run: |
          echo "--- macOS Version ---"
          sw_vers
          echo ""
          echo "--- CPU ---"
          sysctl -n hw.ncpu
          sysctl -n machdep.cpu.brand_string 2>/dev/null || echo "Apple Silicon"
          echo ""
          echo "--- Memory ---"
          sysctl -n hw.memsize | awk '{print $1/1024/1024/1024 " GB"}'
          echo ""
          echo "--- Disk ---"
          df -h /

      - name: Test Work
        run: |
          echo "Message: ${{ github.event.inputs.message }}"
          echo ""
          echo "Doing some test work..."
          sleep 5
          echo "Writing test output..."
          for i in $(seq 1 10); do
            echo "  Step $i/10 complete"
            sleep 1
          done
          echo ""
          echo "✅ Test complete!"
