name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: "10.0.x"
  SERVER_IMAGE: ghcr.io/redth/runnerrunner-server
  HOSTWORKER_IMAGE: ghcr.io/redth/runnerrunner-hostworker
  HOSTWORKER_WINDOWS_IMAGE: ghcr.io/redth/runnerrunner-hostworker-windows

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test RunnerRunner.slnx --configuration Release

  release:
    runs-on: ubuntu-latest
    needs: [test, windows-hostworker-image]
    if: ${{ always() && needs.test.result == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RunnerRunner.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INFORMATIONAL_VERSION=${{ github.ref_name }}
            SOURCE_REVISION_ID=${{ github.sha }}
            BUILD_TAG=${{ github.ref_name }}
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.ref_name }}
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest

      - name: Build and push HostWorker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RunnerRunner.HostWorker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INFORMATIONAL_VERSION=${{ github.ref_name }}
            SOURCE_REVISION_ID=${{ github.sha }}
            BUILD_TAG=${{ github.ref_name }}
          tags: |
            ${{ env.HOSTWORKER_IMAGE }}:${{ github.ref_name }}
            ${{ env.HOSTWORKER_IMAGE }}:${{ github.sha }}
            ${{ env.HOSTWORKER_IMAGE }}:latest

      - name: Publish native HostWorker assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts/release artifacts/publish
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64; do
            out="artifacts/publish/${rid}"
            dotnet publish src/RunnerRunner.HostWorker/RunnerRunner.HostWorker.csproj \
              -c Release \
              -r "${rid}" \
              --self-contained \
              -o "${out}" \
              /p:Version="${version}" \
              /p:InformationalVersion="${GITHUB_REF_NAME}" \
              /p:SourceRevisionId="${GITHUB_SHA}" \
              /p:RunnerRunnerCommitSha="${GITHUB_SHA}" \
              /p:RunnerRunnerBuildTag="${GITHUB_REF_NAME}" \
              --nologo

            if [[ "${rid}" == win-* ]]; then
              (cd "${out}" && zip -qr "../../release/runnerrunner-hostworker-${rid}.zip" .)
            else
              tar -czf "artifacts/release/runnerrunner-hostworker-${rid}.tar.gz" -C "${out}" .
            fi
          done

      - name: Package Linux compose bundle
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          mkdir -p "${staging}/postgres-init"
          cp deploy/linux/compose.yaml "${staging}/compose.yaml"
          cp deploy/linux/install-server.sh "${staging}/install-server.sh"
          cp deploy/linux/update-server.sh "${staging}/update-server.sh"
          cp deploy/postgres-init/*.sql "${staging}/postgres-init/"
          tar -czf artifacts/release/runnerrunner-linux-compose.tar.gz -C "${staging}" .
          cp deploy/linux/compose.yaml artifacts/release/linux-compose.yaml
          cp deploy/linux/install-server.sh artifacts/release/install-server.sh
          cp deploy/linux/update-server.sh artifacts/release/update-server.sh
          cp deploy/macos/install-host-macos.sh artifacts/release/install-host-macos.sh
          cp deploy/windows/Install-HostWorker.ps1 artifacts/release/Install-HostWorker.ps1

      - name: Generate checksums and manifest
        shell: bash
        env:
          WINDOWS_HOSTWORKER_IMAGE_AVAILABLE: ${{ needs.windows-hostworker-image.result == 'success' }}
        run: |
          set -euo pipefail
          cd artifacts/release
          sha256sum -- * > SHA256SUMS
          python - <<'PY'
          import hashlib, json, os
          assets = []
          for name in sorted(os.listdir(".")):
              if name in {"release-manifest.json"}:
                  continue
              if os.path.isfile(name):
                  with open(name, "rb") as f:
                      digest = hashlib.sha256(f.read()).hexdigest()
                  assets.append({"name": name, "sha256": digest})
          images = {
              "server": [
                  f"{os.environ['SERVER_IMAGE']}:{os.environ['GITHUB_REF_NAME']}",
                  f"{os.environ['SERVER_IMAGE']}:{os.environ['GITHUB_SHA']}"
              ],
              "hostworker": [
                  f"{os.environ['HOSTWORKER_IMAGE']}:{os.environ['GITHUB_REF_NAME']}",
                  f"{os.environ['HOSTWORKER_IMAGE']}:{os.environ['GITHUB_SHA']}"
              ]
          }
          if os.environ.get("WINDOWS_HOSTWORKER_IMAGE_AVAILABLE", "").lower() == "true":
              images["hostworkerWindows"] = [
                  f"{os.environ['HOSTWORKER_WINDOWS_IMAGE']}:{os.environ['GITHUB_REF_NAME']}",
                  f"{os.environ['HOSTWORKER_WINDOWS_IMAGE']}:{os.environ['GITHUB_SHA']}"
              ]
          manifest = {
              "version": os.environ["GITHUB_REF_NAME"],
              "gitSha": os.environ["GITHUB_SHA"],
              "images": images,
              "assets": assets
          }
          with open("release-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/release/* \
              --title "${GITHUB_REF_NAME}" \
              --notes "HostWorker RunnerRunner release artifacts for Linux, macOS, and Windows."
          fi

  windows-hostworker-image:
    runs-on: windows-2022
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Ensure Docker daemon is running
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            throw "Docker service is not installed on this runner."
          }

          if ($service.Status -ne "Running") {
            Start-Service docker
          }

          $ready = $false
          $deadline = (Get-Date).AddMinutes(2)
          do {
            docker version
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)

          if (-not $ready) {
            throw "Docker daemon did not become ready."
          }

      - name: Log in to GHCR
        shell: pwsh
        run: |
          "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish Windows HostWorker
        shell: pwsh
        run: |
          $publishDir = "artifacts\windows-hostworker-container"
          dotnet publish src\RunnerRunner.HostWorker\RunnerRunner.HostWorker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -o $publishDir `
            /p:InformationalVersion=${{ github.ref_name }} `
            /p:SourceRevisionId=${{ github.sha }} `
            /p:RunnerRunnerCommitSha=${{ github.sha }} `
            /p:RunnerRunnerBuildTag=${{ github.ref_name }} `
            --nologo

      - name: Build and push Windows HostWorker image
        shell: pwsh
        run: |
          $publishDir = "artifacts\windows-hostworker-container"
          docker build `
            -f src\RunnerRunner.HostWorker\Dockerfile.windows `
            --build-arg INFORMATIONAL_VERSION=${{ github.ref_name }} `
            --build-arg SOURCE_REVISION_ID=${{ github.sha }} `
            --build-arg BUILD_TAG=${{ github.ref_name }} `
            -t "${{ env.HOSTWORKER_WINDOWS_IMAGE }}:${{ github.ref_name }}" `
            -t "${{ env.HOSTWORKER_WINDOWS_IMAGE }}:${{ github.sha }}" `
            -t "${{ env.HOSTWORKER_WINDOWS_IMAGE }}:latest" `
            $publishDir
          docker push "${{ env.HOSTWORKER_WINDOWS_IMAGE }}:${{ github.ref_name }}"
          docker push "${{ env.HOSTWORKER_WINDOWS_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.HOSTWORKER_WINDOWS_IMAGE }}:latest"
